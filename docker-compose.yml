version: "3"

volumes:
  superstreamer_redis_data:  
  superstreamer_postgres_data:  

services:
  superstreamer-nginx:
    image: "nginx:latest"
    container_name: superstreamer-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - 80:80
      - 443:443
    depends_on:
      - superstreamer-app

  superstreamer-api:
    image: "superstreamerapp/api:latest"
    container_name: superstreamer-api
    restart: always
    ports:
      - "52001:3000"
    depends_on:
      - superstreamer-postgres
      - superstreamer-redis
    env_file: .env
    environment:
      - REDIS_HOST=superstreamer-redis
      - REDIS_URI=redis://superstreamer-redis:6379
      - REDIS_PORT=6379
      - DATABASE_URI=postgresql://postgres:sprs@superstreamer-postgres/sprs

  superstreamer-app:
    image: "superstreamerapp/app:latest"
    container_name: superstreamer-app
    ports:
      - "52000:3000"
    environment:
      - PUBLIC_API_ENDPOINT=http://superstreamer-api:52001
      - PUBLIC_STITCHER_ENDPOINT=http://superstreamer-stitcher:52002

  superstreamer-artisan:
    image: "superstreamerapp/artisan:latest"
    container_name: superstreamer-artisan
    restart: always
    depends_on:
      - superstreamer-redis
    env_file: .env
    environment:
      - REDIS_HOST=superstreamer-redis
      - REDIS_URI=redis://superstreamer-redis:6379
      - REDIS_PORT=6379

  superstreamer-stitcher:
    image: "superstreamerapp/stitcher:latest"
    container_name: superstreamer-stitcher
    restart: always
    ports:
      - "52002:3000"
    depends_on:
      - superstreamer-redis
    env_file: .env
    environment:
      - REDIS_PORT=6379
      - REDIS_HOST=superstreamer-redis
      - PUBLIC_API_ENDPOINT=http://superstreamer-api:52001
      - PUBLIC_STITCHER_ENDPOINT=http://superstreamer-stitcher:52002

  superstreamer-redis:
    image: redis/redis-stack-server:7.2.0-v6
    command: ["redis-server", "--bind", "superstreamer-redis", "--port", "6379", "--protected-mode", "no"]
    container_name: superstreamer-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
    volumes:
      - superstreamer_redis_data:/data

  superstreamer-postgres:
    image: "postgres:latest"
    container_name: superstreamer-postgres
    restart: always
    stop_signal: SIGINT
    ports:
      - "5432:5432"
    volumes:
      - superstreamer_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_DB=sprs
      - POSTGRES_PASSWORD=sprs