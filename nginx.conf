events {
    worker_connections  1024;
}

http {
    server {
        listen 80;
        server_name superstreamer.newsniper.org;

        location /.well-known/acme-challenge/ {
                allow all;
                root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
            listen 443 ssl;
            server_name superstreamer.newsniper.org;

            ssl_certificate /etc/letsencrypt/live/superstreamer.newsniper.org/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/superstreamer.newsniper.org/privkey.pem;
            include /etc/letsencrypt/options-ssl-nginx.conf;
            ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

            location / {
                proxy_pass  http://superstreamer-app:52000;
                proxy_set_header    Host                $http_host;
                proxy_set_header    X-Real-IP           $remote_addr;
                proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        }
    }
}